backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "المقالات والبرامج"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "التصنيف", name: "category", widget: "select", options: ["articles", "news", "software"] }
      - { label: "التاريخ", name: "date", widget: "string" }
      - { label: "رابط الصورة", name: "image", widget: "string" }
      - { label: "الملخص", name: "summary", widget: "text" }
      - { label: "رابط التحميل", name: "downloadUrl", widget: "string", required: false }
      - { label: "المحتوى", name: "body", widget: "markdown" }
